<body>
<div class="wrap" id="root"></div>
<script>
'use strict';
const root = document.getElementById('root');
let PW = '';
try { PW = sessionStorage.getItem('kitap-admin') || ''; } catch (e) {}

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

async function api(action, data) {
  const r = await fetch('/api/admin', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-admin-password': PW },
    body: JSON.stringify({ action, ...(data || {}) })
  });
  let j;
  try { j = await r.json(); } catch (e) { j = { error: '服务器返回异常（HTTP ' + r.status + '）。如果是 404，说明接口还没部署成功' }; }
  if (r.status === 401) { logout(); throw new Error(j.error || '密码不对'); }
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

function logout() {
  PW = '';
  try { sessionStorage.removeItem('kitap-admin'); } catch (e) {}
  renderLogin();
}

// ---------- 登录 ----------
function renderLogin(msg) {
  const pw = h('input', { type: 'password', autocomplete: 'current-password', 'aria-label': '管理密码' });
  const out = h('p', { class: 'err' }, msg || '');
  const btn = h('button', { type: 'submit' }, '登录');
  const form = h('form', { class: 'card', onsubmit: async (e) => {
    e.preventDefault();
    btn.disabled = true; out.textContent = '';
    PW = pw.value;
    try {
      await api('categories');
      try { sessionStorage.setItem('kitap-admin', PW); } catch (x) {}
      renderMain();
    } catch (x) { PW = ''; out.textContent = x.message; btn.disabled = false; }
  } }, h('label', {}, '管理密码'), pw, h('div', { class: 'row' }, btn), out);
  root.replaceChildren(h('h1', {}, '管理后台'), form);
}

// ---------- 主界面 ----------
let tab = 'books';
function renderMain() {
  const tabs = h('div', { class: 'tabs' },
    h('button', { class: tab === 'books' ? '' : 'ghost', onclick: () => { tab = 'books'; renderMain(); } }, '书籍管理'),
    h('button', { class: tab === 'upload' ? '' : 'ghost', onclick: () => { tab = 'upload'; renderMain(); } }, '上传新书'));
  const body = h('div');
  root.replaceChildren(
    h('div', { class: 'top' }, h('h1', {}, '管理后台'), h('button', { class: 'ghost', onclick: logout }, '退出')),
    tabs, body);
  if (tab === 'books') viewBooks(body); else viewUpload(body);
}

const STATUS = { published: '已上架', hidden: '已下架', draft: '草稿' };
const LANG = { kk: '哈萨克语', ru: '俄语', zh: '中文', en: '英语' };
const SCRIPT = { cyrillic: '西里尔', latin: '拉丁', arabic: '阿拉伯', han: '汉字' };

async function viewBooks(box) {
  box.append(h('p', { class: 'muted' }, '加载中…'));
  let books; let cats = [];
  try { books = (await api('list')).books; cats = (await api('categories')).categories; } catch (e) { box.replaceChildren(h('p', { class: 'err' }, e.message)); return; }
  const draw = () => {
    if (!books.length) { box.replaceChildren(h('p', { class: 'muted' }, '还没有书。去“上传新书”添加。')); return; }
    box.replaceChildren(...books.map((b) => {
      const msg = h('div', { class: 'err' });
      const act = async (fn) => {
        msg.textContent = '';
        try { await fn(); } catch (e) { msg.textContent = e.message; }
      };
      const row = h('div', { class: 'row' });
      if (b.status !== 'published') {
        row.append(h('button', { onclick: () => act(async () => { await api('set_status', { id: b.id, status: 'published' }); b.status = 'published'; draw(); }) }, '上架'));
      } else {
        row.append(h('button', { class: 'ghost', onclick: () => act(async () => { await api('set_status', { id: b.id, status: 'hidden' }); b.status = 'hidden'; draw(); }) }, '下架'));
      }
      row.append(h('button', { class: 'ghost', onclick: () => act(async () => { await api('set_featured', { id: b.id, value: !b.is_featured }); b.is_featured = !b.is_featured; draw(); }) }, b.is_featured ? '取消推荐' : '设为推荐'));
      row.append(h('button', { class: 'ghost', onclick: () => {
        const ex = card.querySelector('.editbox');
        if (ex) { ex.remove(); return; }
        card.append(editForm(b, cats, draw));
      } }, '编辑'));
      row.append(h('button', { class: 'danger', onclick: () => {
        if (!confirm('永久删除《' + b.title + '》和它的全部章节？不能恢复。')) return;
        act(async () => { await api('delete', { id: b.id }); books = books.filter((x) => x.id !== b.id); draw(); });
      } }, '删除'));
      const card = h('div', { class: 'card' },
        b.cover_url ? h('img', { class: 'thumb', src: b.cover_url, alt: '' }) : null,
        h('div', { class: 'bt', dir: 'auto' }, b.title),
        h('div', { class: 'muted', dir: 'auto' }, b.author),
        h('div', { style: 'margin-top:6px' },
          h('span', { class: 'badge ' + b.status }, STATUS[b.status] || b.status),
          h('span', { class: 'badge' }, (LANG[b.language] || b.language) + (b.language === 'kk' ? ' · ' + (SCRIPT[b.script] || b.script) : '')),
          h('span', { class: 'badge' }, b.chapter_count + ' 章'),
          b.is_featured ? h('span', { class: 'badge' }, '推荐') : null),
        h('div', { class: 'muted', dir: 'auto', style: 'margin-top:6px' }, '版权：' + (b.copyright_note || '—')),
        row, msg);
      return card;
    }));
  };
  draw();
}

// ---------- 编辑 ----------
async function toJpegBase64(file) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, 600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.85));
  const buf = new Uint8Array(await blob.arrayBuffer());
  let bin = '';
  for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return btoa(bin);
}

function editForm(b, cats, redraw) {
  const catSlug = (cats.find((c) => c.id === b.category_id) || {}).slug || '';
  const f = {
    title: h('input', { dir: 'auto', value: b.title }),
    author: h('input', { dir: 'auto', value: b.author }),
    desc: h('textarea', { dir: 'auto' }),
    cover: h('input', { type: 'url', placeholder: 'https://…' }),
    cat: h('select', {}, h('option', { value: '' }, '（不分类）'), cats.map((c) => h('option', { value: c.slug }, (c.name && (c.name.zh || c.name.en || c.name.kk)) || c.slug))),
    note: h('textarea', { dir: 'auto' }),
    dir: h('select', {}, ['ltr', 'rtl', 'auto'].map((k) => h('option', { value: k }, { ltr: '从左到右', rtl: '从右到左', auto: '自动' }[k]))),
    img: h('input', { type: 'file', accept: 'image/*' })
  };
  f.desc.value = b.description || '';
  f.cover.value = b.cover_url || '';
  f.cat.value = catSlug;
  f.note.value = b.copyright_note || '';
  f.dir.value = b.text_direction || 'auto';
  const msg = h('div', { class: 'muted' });
  const save = h('button', {}, '保存修改');
  save.addEventListener('click', async () => {
    save.disabled = true; msg.className = 'muted'; msg.textContent = '保存中…';
    try {
      await api('update_book', { id: b.id, fields: {
        title: f.title.value, author: f.author.value, description: f.desc.value,
        cover_url: f.cover.value.trim(), category_slug: f.cat.value,
        copyright_note: f.note.value, text_direction: f.dir.value
      } });
      b.title = f.title.value; b.author = f.author.value; b.description = f.desc.value || null;
      b.cover_url = f.cover.value.trim() || null; b.copyright_note = f.note.value; b.text_direction = f.dir.value;
      b.category_id = (cats.find((c) => c.slug === f.cat.value) || {}).id || null;
      if (f.img.files[0]) {
        msg.textContent = '上传封面…';
        const data = await toJpegBase64(f.img.files[0]);
        b.cover_url = (await api('upload_cover', { id: b.id, data })).cover_url;
      }
      redraw();
    } catch (e) { msg.className = 'err'; msg.textContent = e.message; save.disabled = false; }
  });
  const field = (label, el) => [h('label', {}, label), el];
  return h('div', { class: 'editbox' },
    field('书名', f.title), field('作者', f.author), field('简介', f.desc),
    field('分类', f.cat), field('版权来源', f.note), field('文字方向', f.dir),
    field('封面：选一张图片上传（自动压缩）', f.img),
    field('或者填封面图片地址（https://…）', f.cover),
    h('p', { class: 'muted' }, '语言和文字不能修改。选了图片会优先使用图片。'),
    h('div', { class: 'row' }, save), msg);
}

// ---------- 上传 ----------
const SCRIPTS_BY_LANG = { kk: ['cyrillic', 'latin', 'arabic'], ru: ['cyrillic'], zh: ['han'], en: ['latin'] };

async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map((x) => x.toString(16).padStart(2, '0')).join('');
}

// 严格读取：不是有效 UTF-8、带 BOM、有乱码字符，都直接报错，不修复
async function parseChapter(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  if (buf.length >= 3 && buf[0] === 0xEF && buf[1] === 0xBB && buf[2] === 0xBF) throw new Error('开头有 BOM 标记，请用“不带 BOM 的 UTF-8”重新保存');
  let text;
  try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (e) { throw new Error('不是有效的 UTF-8 编码'); }
  if (text.includes('\u0000')) throw new Error('含有空字符，文件可能已损坏');
  if (text.includes('\uFFFD')) throw new Error('含有乱码字符 �，请先修复源文件');
  const m = file.name.match(/^(\d+)/);
  if (!m) throw new Error('文件名必须以数字开头，例如 001.txt');
  const n = parseInt(m[1], 10);
  if (n < 1) throw new Error('章节编号必须从 1 开始');
  const head = text.match(/^([^\r\n]*)\r?\n\r?\n/);
  if (!head) throw new Error('格式不对：第 1 行标题，第 2 行空行，第 3 行起正文');
  const title = head[1];
  if (title.trim() === '') throw new Error('章节标题为空');
  const content = text.slice(head[0].length);
  if (content.trim() === '') throw new Error('正文为空');
  return { n, title, content, sha: await sha256(content), bytes: new TextEncoder().encode(content).length };
}

// ---------- 格式转换（全部在浏览器里完成，不加载任何外部代码） ----------
const MAX_FILE = 60 * 1024 * 1024;

function decodeStrict(u8) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(u8); } catch (e) { throw new Error('文件里有不是 UTF-8 的内容，已停止，不会猜测或修复'); }
}

async function unzip(buf) {
  if (typeof DecompressionStream === 'undefined') throw new Error('这个浏览器太旧，不支持解压。请换最新版 Chrome');
  const dv = new DataView(buf);
  const u8 = new Uint8Array(buf);
  let e = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
  }
  if (e < 0) throw new Error('不是有效的 EPUB / DOCX 文件');
  const count = dv.getUint16(e + 10, true);
  let p = dv.getUint32(e + 16, true);
  const files = new Map();
  for (let k = 0; k < count; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('压缩包结构损坏');
    const nlen = dv.getUint16(p + 28, true);
    const elen = dv.getUint16(p + 30, true);
    const clen = dv.getUint16(p + 32, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nlen));
    files.set(name, { flag: dv.getUint16(p + 8, true), method: dv.getUint16(p + 10, true), csize: dv.getUint32(p + 20, true), usize: dv.getUint32(p + 24, true), off: dv.getUint32(p + 42, true) });
    p += 46 + nlen + elen + clen;
  }
  return {
    has: (n) => files.has(n),
    async read(name) {
      const f = files.get(name);
      if (!f) return null;
      if (f.flag & 1) throw new Error('文件已加密，不能读取');
      if (f.usize > 40 * 1024 * 1024) throw new Error('压缩包里有过大的文件：' + name);
      const lh = f.off;
      const start = lh + 30 + dv.getUint16(lh + 26, true) + dv.getUint16(lh + 28, true);
      const data = u8.subarray(start, start + f.csize);
      if (f.method === 0) return data.slice();
      if (f.method !== 8) throw new Error('不支持的压缩方式');
      const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }
  };
}

function parseMarkup(text) {
  let doc = new DOMParser().parseFromString(text, 'application/xhtml+xml');
  if (doc.getElementsByTagName('parsererror').length) doc = new DOMParser().parseFromString(text, 'text/html');
  return doc;
}

const BLOCK = new Set(['P', 'DIV', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'LI', 'UL', 'OL', 'BLOCKQUOTE', 'SECTION', 'ARTICLE', 'ASIDE', 'HEADER', 'FOOTER', 'NAV', 'TABLE', 'TR', 'TD', 'TH', 'THEAD', 'TBODY', 'DD', 'DT', 'DL', 'FIGURE', 'FIGCAPTION', 'PRE', 'HR', 'MAIN', 'FORM', 'BODY']);
const SKIP = new Set(['SCRIPT', 'STYLE', 'HEAD', 'SVG', 'TITLE', 'NOSCRIPT']);

function tidy(s) {
  return s.split('\n').map((x) => x.replace(/^[ \t\r\f]+|[ \t\r\f]+$/g, '')).join('\n').replace(/^\n+|\n+$/g, '');
}

// 网页 → 段落列表。每个块级元素是一段；<br> 变成换行；连续空白合并成一个空格（网页本身就是这样显示的）
function htmlToParas(root) {
  const out = [];
  let cur = '';
  let lv = 0;
  const flush = () => { const t = tidy(cur); if (t !== '') out.push({ t, lv }); cur = ''; };
  const go = (n) => {
    if (n.nodeType === 3) { cur += n.nodeValue.replace(/[ \t\r\n\f]+/g, ' '); return; }
    if (n.nodeType !== 1) return;
    const tag = n.localName.toUpperCase();
    if (SKIP.has(tag)) return;
    if (tag === 'BR') { cur += '\n'; return; }
    const hm = /^H([1-6])$/.exec(tag);
    const block = BLOCK.has(tag);
    if (block) flush();
    const prev = lv;
    if (hm) lv = +hm[1];
    for (const c of n.childNodes) go(c);
    if (block) flush();
    if (hm) lv = prev;
  };
  go(root);
  flush();
  return out;
}

function autoLevel(counts) {
  for (const L of [1, 2, 3]) if ((counts[L] || 0) >= 2) return L;
  return 0;
}
function parasLevelCounts(paras) {
  const c = {};
  paras.forEach((p) => { if (p.lv) c[p.lv] = (c[p.lv] || 0) + 1; });
  return c;
}

function splitParas(paras, level, fallback) {
  const chs = [];
  let cur = null;
  for (const p of paras) {
    if (level && p.lv === level) { cur = { title: p.t.replace(/\n+/g, ' '), paras: [] }; chs.push(cur); }
    else {
      if (!cur) { cur = { title: fallback, paras: [] }; chs.push(cur); }
      cur.paras.push(p.t);
    }
  }
  return chs.map((c) => ({ title: c.title, content: c.paras.join('\n\n') })).filter((c) => c.content.trim() !== '');
}

const MD_HEAD = /^(#{1,6})[ \t]+(.+?)[ \t]*#*[ \t]*$/;
function mdLevelCounts(text) {
  const c = {};
  text.split(/\r?\n/).forEach((l) => { const m = MD_HEAD.exec(l); if (m) c[m[1].length] = (c[m[1].length] || 0) + 1; });
  return c;
}
function splitMd(text, level, fallback) {
  const chs = [];
  let cur = null;
  for (const line of text.split(/\r?\n/)) {
    const m = MD_HEAD.exec(line);
    if (level && m && m[1].length === level) { cur = { title: m[2], lines: [] }; chs.push(cur); }
    else {
      if (!cur) { cur = { title: fallback, lines: [] }; chs.push(cur); }
      cur.lines.push(line);
    }
  }
  return chs.map((c) => ({ title: c.title, content: c.lines.join('\n').replace(/^\n+|\n+$/g, '') })).filter((c) => c.content.trim() !== '');
}

const baseName = (n) => n.replace(/\.[^.]+$/, '');
const dirOf = (p) => (p.includes('/') ? p.slice(0, p.lastIndexOf('/') + 1) : '');
const resolvePath = (base, rel) => {
  try { return decodeURIComponent(new URL(rel, 'http://h/' + base).pathname.slice(1)); } catch (e) { return rel; }
};
const oneLine = (s) => s.replace(/\s+/g, ' ').trim();

async function convertEpub(file) {
  const zip = await unzip(await file.arrayBuffer());
  const rd = async (path) => { const b = await zip.read(path); return b ? decodeStrict(b) : null; };
  const container = await rd('META-INF/container.xml');
  if (!container) throw new Error('不是有效的 EPUB（缺少 container.xml）');
  const root = new DOMParser().parseFromString(container, 'application/xml').getElementsByTagName('rootfile')[0];
  const opfPath = root && root.getAttribute('full-path');
  const opfText = opfPath && await rd(opfPath);
  if (!opfText) throw new Error('不是有效的 EPUB（找不到内容清单）');
  const opf = new DOMParser().parseFromString(opfText, 'application/xml');
  const dir = dirOf(opfPath);
  const manifest = new Map();
  for (const it of opf.getElementsByTagName('item')) {
    manifest.set(it.getAttribute('id'), { href: resolvePath(dir, it.getAttribute('href') || ''), type: it.getAttribute('media-type') || '', props: it.getAttribute('properties') || '' });
  }
  const spine = [...opf.getElementsByTagName('itemref')].map((r) => manifest.get(r.getAttribute('idref'))).filter(Boolean);

  // 目录：优先 nav.xhtml，其次 toc.ncx
  const toc = new Map();
  const navItem = [...manifest.values()].find((m) => /\bnav\b/.test(m.props));
  if (navItem) {
    const t = await rd(navItem.href);
    if (t) {
      const doc = new DOMParser().parseFromString(t, 'text/html');
      const navs = [...doc.querySelectorAll('nav')];
      const nav = navs.find((n) => (n.getAttribute('epub:type') || '') === 'toc') || navs[0];
      if (nav) for (const a of nav.querySelectorAll('a')) {
        const href = a.getAttribute('href');
        const label = oneLine(a.textContent || '');
        if (!href || !label) continue;
        const path = resolvePath(dirOf(navItem.href), href.split('#')[0]);
        if (!toc.has(path)) toc.set(path, label);
      }
    }
  }
  if (!toc.size) {
    const ncx = [...manifest.values()].find((m) => m.type === 'application/x-dtbncx+xml');
    const t = ncx && await rd(ncx.href);
    if (t) {
      const doc = new DOMParser().parseFromString(t, 'application/xml');
      for (const np of doc.getElementsByTagName('navPoint')) {
        const tx = np.getElementsByTagName('text')[0];
        const ct = np.getElementsByTagName('content')[0];
        const label = tx ? oneLine(tx.textContent || '') : '';
        const src = ct && ct.getAttribute('src');
        if (!label || !src) continue;
        const path = resolvePath(dirOf(ncx.href), src.split('#')[0]);
        if (!toc.has(path)) toc.set(path, label);
      }
    }
  }

  const items = [];
  let k = 0;
  for (const m of spine) {
    if (!/html/.test(m.type)) continue;
    const text = await rd(m.href);
    if (!text) continue;
    const doc = parseMarkup(text);
    const body = doc.getElementsByTagName('body')[0] || doc.documentElement;
    const paras = htmlToParas(body);
    if (!paras.length) continue;
    k++;
    let title = toc.get(m.href);
    if (!title) { const hd = paras.slice(0, 3).find((p) => p.lv >= 1 && p.lv <= 3); title = hd ? oneLine(hd.t) : baseName(m.href.split('/').pop()); }
    if (paras[0].lv > 0 && oneLine(paras[0].t) === title) paras.shift();
    const content = paras.map((p) => p.t).join('\n\n');
    if (content.trim() === '') continue;
    items.push({ title, content });
  }
  if (!items.length) throw new Error('EPUB 里没有找到文字内容');
  return items;
}

async function convertDocx(file) {
  const zip = await unzip(await file.arrayBuffer());
  const docXml = zip.has('word/document.xml') ? decodeStrict(await zip.read('word/document.xml')) : null;
  if (!docXml) throw new Error('不是有效的 DOCX 文件');
  const styleLv = new Map();
  if (zip.has('word/styles.xml')) {
    const sdoc = new DOMParser().parseFromString(decodeStrict(await zip.read('word/styles.xml')), 'application/xml');
    for (const st of sdoc.getElementsByTagName('w:style')) {
      const id = st.getAttribute('w:styleId');
      const nm = st.getElementsByTagName('w:name')[0];
      const name = nm ? (nm.getAttribute('w:val') || '') : '';
      let lv = 0;
      const m = /^(?:heading|标题)\s*([1-9])$/i.exec(name);
      if (m) lv = +m[1];
      else { const ol = st.getElementsByTagName('w:outlineLvl')[0]; if (ol) lv = (+ol.getAttribute('w:val')) + 1; }
      if (id && lv) styleLv.set(id, lv);
    }
  }
  const doc = new DOMParser().parseFromString(docXml, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('DOCX 内容无法解析');
  const paras = [];
  for (const p of doc.getElementsByTagName('w:p')) {
    let s = '';
    const walk = (n) => {
      for (const c of n.childNodes) {
        if (c.nodeType !== 1) continue;
        const nm = c.nodeName;
        if (nm === 'w:t') s += c.textContent;
        else if (nm === 'w:tab') s += '\t';
        else if (nm === 'w:noBreakHyphen') s += '-';
        else if (nm === 'w:br') { if (c.getAttribute('w:type') !== 'page') s += '\n'; }
        else if (nm === 'w:delText' || nm === 'w:instrText') continue;
        else walk(c);
      }
    };
    walk(p);
    const t = tidy(s);
    if (t === '') continue;
    const ps = p.getElementsByTagName('w:pStyle')[0];
    let lv = ps ? (styleLv.get(ps.getAttribute('w:val')) || 0) : 0;
    if (!lv) { const ol = p.getElementsByTagName('w:outlineLvl')[0]; if (ol) lv = (+ol.getAttribute('w:val')) + 1; }
    paras.push({ t, lv: lv > 6 ? 0 : lv });
  }
  if (!paras.length) throw new Error('Word 文件里没有找到文字');
  return paras;
}

async function readText(file) {
  return decodeStrict(new Uint8Array(await file.arrayBuffer()));
}

async function viewUpload(box) {
  let cats = [];
  try { cats = (await api('categories')).categories; } catch (e) { box.append(h('p', { class: 'err' }, e.message)); return; }

  const f = {
    title: h('input', { dir: 'auto' }),
    author: h('input', { dir: 'auto' }),
    lang: h('select', {}, Object.keys(LANG).map((k) => h('option', { value: k }, LANG[k]))),
    script: h('select'),
    dir: h('select', {}, ['ltr', 'rtl', 'auto'].map((k) => h('option', { value: k }, { ltr: '从左到右', rtl: '从右到左', auto: '自动' }[k]))),
    cat: h('select', {}, h('option', { value: '' }, '（不分类）'), cats.map((c) => h('option', { value: c.slug }, (c.name && (c.name.zh || c.name.en || c.name.kk)) || c.slug))),
    desc: h('textarea', { dir: 'auto' }),
    cover: h('input', { type: 'url', placeholder: 'https://…（可不填）' }),
    note: h('textarea', { dir: 'auto', placeholder: '例如：公版（作者逝世超过 70 年）/ 作者授权 / 自己原创' }),
    feat: h('input', { type: 'checkbox' }),
    pub: h('input', { type: 'checkbox', checked: true }),
    rep: h('input', { type: 'checkbox' }),
    files: h('input', { type: 'file', multiple: true, accept: '.txt,.epub,.docx,.html,.htm,.md,.markdown' }),
    level: h('select', {}, [['auto', '自动'], ['1', '一级标题'], ['2', '二级标题'], ['3', '三级标题'], ['0', '不分章（整本一章）']].map(([v, l]) => h('option', { value: v }, l)))
  };
  const fillScripts = () => {
    f.script.replaceChildren(...SCRIPTS_BY_LANG[f.lang.value].map((s) => h('option', { value: s }, SCRIPT[s])));
    f.dir.value = f.script.value === 'arabic' ? 'rtl' : 'ltr';
  };
  f.lang.addEventListener('change', fillScripts);
  f.script.addEventListener('change', () => { f.dir.value = f.script.value === 'arabic' ? 'rtl' : 'ltr'; });
  fillScripts();

  let mode = 'none'; // none | txt | conv
  let chapters = []; // txt 模式
  let conv = null; // conv 模式：{ kind, paras|text, fallback, items }
  const preview = h('div');
  const levelBox = h('div', { style: 'display:none' }, h('label', {}, '按几级标题分章'), f.level);
  const log = h('div');
  const go = h('button', {}, '开始上传');

  function setItems(list) {
    conv.items = list.map((c) => ({ inc: true, title: c.title, content: c.content, bytes: new TextEncoder().encode(c.content).length }));
    renderConv();
  }

  function applySplit() {
    const v = f.level.value;
    if (conv.kind === 'paras') {
      const L = v === 'auto' ? autoLevel(parasLevelCounts(conv.paras)) : +v;
      setItems(splitParas(conv.paras, L, conv.fallback));
    } else if (conv.kind === 'md') {
      const L = v === 'auto' ? autoLevel(mdLevelCounts(conv.text)) : +v;
      setItems(splitMd(conv.text, L, conv.fallback));
    }
  }
  f.level.addEventListener('change', () => { if (conv) applySplit(); });

  function renderConv() {
    const summary = h('p', { class: 'ok' });
    const upd = () => {
      const n = conv.items.filter((x) => x.inc).length;
      summary.textContent = '转换完成：共 ' + conv.items.length + ' 章，已选 ' + n + ' 章。请检查标题和内容，不需要的取消勾选（封面、目录、版权页等）';
    };
    upd();
    const rows = conv.items.map((it, i) => {
      const cb = h('input', { type: 'checkbox', checked: it.inc });
      cb.addEventListener('change', () => { it.inc = cb.checked; upd(); });
      const ti = h('input', { dir: 'auto', value: it.title });
      ti.addEventListener('input', () => { it.title = ti.value; });
      const tooBig = it.bytes > MAXCH;
      return h('div', { class: 'convrow' },
        h('label', { class: 'chk' }, cb, '#' + (i + 1) + '　' + Math.round(it.bytes / 1024) + ' KB'),
        ti,
        h('div', { class: 'muted', dir: 'auto' }, oneLine(it.content.slice(0, 80)) + '…'),
        tooBig ? h('div', { class: 'err' }, '这一章超过 3.5MB，请取消勾选或换分章方式') : null);
    });
    preview.replaceChildren(summary, ...rows);
  }

  async function collectConv() {
    const sel = conv.items.filter((x) => x.inc);
    if (!sel.length) throw new Error('没有选中任何章节');
    const out = [];
    let n = 0;
    for (const it of sel) {
      n++;
      if (!it.title.trim()) throw new Error('第 ' + n + ' 章标题为空');
      if (it.title.includes('\uFFFD') || it.content.includes('\uFFFD') || it.content.includes('\u0000')) throw new Error('第 ' + n + ' 章含有乱码或空字符，已停止');
      if (it.bytes > MAXCH) throw new Error('第 ' + n + ' 章超过 3.5MB');
      out.push({ n, title: it.title, content: it.content, sha: await sha256(it.content), bytes: it.bytes });
    }
    return out;
  }

  async function handleTxt(files) {
    mode = 'txt'; conv = null; chapters = [];
    levelBox.style.display = 'none';
    const sorted = files.sort((a, b) => a.name.localeCompare(b.name, 'en', { numeric: true }));
    const items = [];
    let anyBad = false;
    for (const file of sorted) {
      try {
        const c = await parseChapter(file);
        if (c.bytes > MAXCH) throw new Error('单章超过 3.5MB，请拆分');
        c.file = file.name;
        chapters.push(c);
        items.push(h('li', {}, file.name + ' → ', h('span', { dir: 'auto' }, c.title), ' （' + Math.round(c.bytes / 1024) + ' KB）'));
      } catch (e) {
        anyBad = true;
        items.push(h('li', { class: 'bad' }, file.name + '：' + e.message));
      }
    }
    const nums = chapters.map((c) => c.n);
    const dup = nums.find((n, i) => nums.indexOf(n) !== i);
    if (dup !== undefined) { anyBad = true; items.push(h('li', { class: 'bad' }, '章节编号重复：' + dup)); }
    if (anyBad) chapters = [];
    preview.replaceChildren(
      h('p', { class: anyBad ? 'err' : 'ok' }, anyBad ? '有文件不合格，修好后重新选择（不会自动修复）' : '✓ 检查通过，共 ' + chapters.length + ' 章'),
      h('ul', { class: 'ch' }, items));
  }

  async function handleOne(file, ext) {
    mode = 'conv'; chapters = [];
    const fb = baseName(file.name);
    if (ext === 'epub') {
      levelBox.style.display = 'none';
      conv = { kind: 'fixed', items: [] };
      setItems(await convertEpub(file));
    } else if (ext === 'docx') {
      levelBox.style.display = '';
      f.level.value = 'auto';
      conv = { kind: 'paras', paras: await convertDocx(file), fallback: fb, items: [] };
      applySplit();
    } else if (ext === 'md' || ext === 'markdown') {
      levelBox.style.display = '';
      f.level.value = 'auto';
      conv = { kind: 'md', text: await readText(file), fallback: fb, items: [] };
      applySplit();
    } else { // html
      levelBox.style.display = '';
      f.level.value = 'auto';
      const doc = parseMarkup(await readText(file));
      conv = { kind: 'paras', paras: htmlToParas(doc.getElementsByTagName('body')[0] || doc.documentElement), fallback: fb, items: [] };
      applySplit();
    }
    if (!conv.items.length) throw new Error('没有转换出任何章节');
  }

  f.files.addEventListener('change', async () => {
    mode = 'none'; chapters = []; conv = null;
    levelBox.style.display = 'none';
    const files = [...f.files.files];
    if (!files.length) { preview.replaceChildren(); return; }
    preview.replaceChildren(h('p', { class: 'muted' }, '检查 / 转换文件中…'));
    const exts = files.map((x) => (x.name.split('.').pop() || '').toLowerCase());
    try {
      if (files.some((x) => x.size > MAX_FILE)) throw new Error('文件超过 60MB');
      if (exts.every((e) => e === 'txt')) await handleTxt(files);
      else if (files.length === 1 && ['epub', 'docx', 'html', 'htm', 'md', 'markdown'].includes(exts[0])) await handleOne(files[0], exts[0]);
      else if (exts.includes('doc') || exts.includes('pdf')) throw new Error('暂不支持 .doc 和 PDF。Word 请另存为 .docx');
      else throw new Error('一次只能选一个 EPUB / Word(.docx) / HTML / Markdown 文件；或者选多个 .txt 章节文件');
    } catch (e) {
      mode = 'none'; conv = null; chapters = [];
      levelBox.style.display = 'none';
      preview.replaceChildren(h('p', { class: 'err' }, e.message));
    }
  });

  go.addEventListener('click', async () => {
    log.replaceChildren();
    const say = (t, cls) => log.append(h('div', { class: cls || 'muted' }, t));
    const meta = {
      title: f.title.value, author: f.author.value, language: f.lang.value, script: f.script.value,
      text_direction: f.dir.value, category_slug: f.cat.value, description: f.desc.value,
      cover_url: f.cover.value.trim(), copyright_note: f.note.value, is_featured: f.feat.checked
    };
    if (!meta.title.trim() || !meta.author.trim()) return say('请填写书名和作者', 'err');
    if (!meta.copyright_note.trim()) return say('请填写版权来源', 'err');
    if (mode === 'none' || (mode === 'txt' && !chapters.length) || (mode === 'conv' && !conv.items.some((x) => x.inc))) return say('请先选择合格的章节文件', 'err');
    go.disabled = true;
    let bookId = null;
    try {
      const list = mode === 'txt' ? chapters : await collectConv();
      say('创建草稿…');
      bookId = (await api('create_book', { meta, replace: f.rep.checked })).id;
      // 分批上传
      const batches = []; let cur = []; let size = 0;
      for (const c of list) {
        if (cur.length && size + c.bytes > BATCH) { batches.push(cur); cur = []; size = 0; }
        cur.push(c); size += c.bytes;
      }
      if (cur.length) batches.push(cur);
      let done = 0;
      for (const b of batches) {
        await api('add_chapters', { book_id: bookId, chapters: b.map((c) => ({ n: c.n, title: c.title, content: c.content, sha: c.sha })) });
        done += b.length;
        say('已上传 ' + done + ' / ' + list.length + ' 章');
      }
      say('逐章校验中…');
      const r = await api('finalize', {
        book_id: bookId, publish: f.pub.checked,
        book: { title: meta.title, author: meta.author, description: meta.description || null },
        expected: list.map((c) => ({ n: c.n, title: c.title, sha: c.sha }))
      });
      if (!r.ok) {
        say('✗ 校验失败，这本书保持草稿，读者看不到：', 'err');
        r.problems.forEach((p) => say('- ' + p, 'err'));
      } else {
        say('✓ 校验通过：数据库里的内容与上传的完全一致' + (r.published ? '，已上架' : '，保持草稿（可在书籍管理里上架）'), 'ok');
      }
    } catch (e) {
      say('✗ ' + e.message, 'err');
      if (bookId) {
        try { await api('abort', { id: bookId }); say('已撤销这次未完成的草稿', 'muted'); } catch (x) { say('草稿未能自动撤销，请到“书籍管理”删除', 'err'); }
      }
    }
    go.disabled = false;
  });

  const field = (label, el) => [h('label', {}, label), el];
  box.replaceChildren(h('div', { class: 'card' },
    field('书名（原文）', f.title), field('作者（原文）', f.author),
    field('语言', f.lang), field('文字（哈萨克语才需要选）', f.script), field('文字方向', f.dir),
    field('分类', f.cat), field('简介（可不填）', f.desc), field('封面图片地址（可不填）', f.cover),
    field('版权来源（必填）', f.note),
    h('label', { class: 'chk' }, f.feat, '设为推荐'),
    h('label', { class: 'chk' }, f.pub, '校验通过后立即上架'),
    h('label', { class: 'chk' }, f.rep, '覆盖已有的同一本书（同名同作者）'),
    field('书的文件：多个 .txt 章节文件（001.txt、002.txt…，第 1 行标题，第 2 行空行，第 3 行起正文），或者一个 EPUB / Word(.docx) / HTML / Markdown 文件', f.files),
    levelBox,
    preview,
    h('div', { class: 'row' }, go),
    log));
}
const MAXCH = 3500000;
const BATCH = 2500000;

if (PW) { renderMain(); } else { renderLogin(); }
</script>
