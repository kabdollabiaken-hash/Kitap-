<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>听书</title>
<style>
  :root { --bg:#faf8f3; --fg:#222; --muted:#777; --accent:#2a7f62; --card:#fff; --line:#e6e2d8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181a; --fg:#e8e6e1; --muted:#999; --accent:#4cc49a; --card:#202326; --line:#33373b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,sans-serif; padding:16px; max-width:560px; margin:0 auto; }
  h1 { font-size:18px; margin:4px 0 12px; }
  #now { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  #title { font-weight:600; margin-bottom:10px; }
  audio { width:100%; }
  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  button { flex:1; min-width:56px; padding:10px 8px; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; font-size:15px; }
  button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  ul { list-style:none; padding:0; margin:16px 0 0; }
  li { padding:12px 14px; border:1px solid var(--line); background:var(--card); border-radius:10px; margin-bottom:8px; display:flex; justify-content:space-between; gap:8px; }
  li.cur { border-color:var(--accent); color:var(--accent); font-weight:600; }
  li small { color:var(--muted); font-weight:400; }
  #msg { color:var(--muted); margin-top:16px; }
</style>
</head>
<body>
<h1 id="bookname">听书</h1>
<div id="now" hidden>
  <div id="title"></div>
  <audio id="player" controls preload="metadata"></audio>
  <div class="row">
    <button id="prev">上一章</button>
    <button id="next">下一章</button>
  </div>
  <div class="row" id="speeds"></div>
</div>
<ul id="list"></ul>
<div id="msg"></div>

<script>
// ===== 只需改这两行（用 publishable key，可以公开；绝对不要放 secret key）=====
const SUPABASE_URL = "https://zefascvoxzlvyfhvtxiv.supabase.co";
const PUBLISHABLE_KEY = "sb_publishable_2Pyi3zFlaoLpjFYo5v8ASQ__8ZIk-DM";
// ===========================================================================

const params = new URLSearchParams(location.search);
const BOOK = params.get("book") || "test-book";
const SKEY = "listen:" + BOOK;
const SPEEDS = [0.75, 1, 1.25, 1.5, 2];

const $ = id => document.getElementById(id);
const player = $("player");
let chapters = [];
let idx = 0;

function saved() {
  try { return JSON.parse(localStorage.getItem(SKEY)) || {}; } catch (e) { return {}; }
}
function save(extra) {
  try {
    const s = Object.assign(saved(), { chapter: chapters[idx] && chapters[idx].chapter_no, time: player.currentTime }, extra || {});
    localStorage.setItem(SKEY, JSON.stringify(s));
  } catch (e) {}
}

function fmt(sec) {
  if (!sec) return "";
  const m = Math.floor(sec / 60), s = sec % 60;
  return m + ":" + String(s).padStart(2, "0");
}

function renderList() {
  const ul = $("list");
  ul.innerHTML = "";
  chapters.forEach((c, i) => {
    const li = document.createElement("li");
    if (i === idx) li.className = "cur";
    const a = document.createElement("span");
    a.textContent = (c.title || ("第 " + c.chapter_no + " 章"));
    const b = document.createElement("small");
    b.textContent = fmt(c.duration_sec);
    li.append(a, b);
    li.onclick = () => load(i, 0, true);
    ul.appendChild(li);
  });
}

function load(i, startTime, autoplay) {
  if (i < 0 || i >= chapters.length) return;
  idx = i;
  const c = chapters[i];
  $("title").textContent = c.title || ("第 " + c.chapter_no + " 章");
  player.src = c.audio_url;
  player.playbackRate = saved().speed || 1;
  player.addEventListener("loadedmetadata", function once() {
    player.removeEventListener("loadedmetadata", once);
    if (startTime > 0 && startTime < player.duration - 2) player.currentTime = startTime;
  });
  if (autoplay) player.play().catch(() => {});
  renderList();
  save();
}

function renderSpeeds() {
  const box = $("speeds");
  box.innerHTML = "";
  const cur = saved().speed || 1;
  SPEEDS.forEach(sp => {
    const b = document.createElement("button");
    b.textContent = sp + "x";
    if (sp === cur) b.className = "on";
    b.onclick = () => {
      player.playbackRate = sp;
      save({ speed: sp });
      renderSpeeds();
    };
    box.appendChild(b);
  });
}

async function init() {
  $("bookname").textContent = "听书：" + BOOK;
  try {
    const url = SUPABASE_URL + "/rest/v1/audio_chapters?book_id=eq." + encodeURIComponent(BOOK) +
      "&order=chapter_no.asc&select=chapter_no,title,audio_url,duration_sec";
    const r = await fetch(url, { headers: { apikey: PUBLISHABLE_KEY } });
    if (!r.ok) throw new Error("HTTP " + r.status);
    chapters = await r.json();
  } catch (e) {
    $("msg").textContent = "加载失败：" + e.message;
    return;
  }
  if (!chapters.length) {
    $("msg").textContent = "这本书还没有音频章节。";
    return;
  }
  $("now").hidden = false;
  const s = saved();
  let start = chapters.findIndex(c => c.chapter_no === s.chapter);
  if (start < 0) start = 0;
  renderSpeeds();
  load(start, s.time || 0, false);
}

$("prev").onclick = () => load(idx - 1, 0, true);
$("next").onclick = () => load(idx + 1, 0, true);
player.addEventListener("ended", () => { if (idx + 1 < chapters.length) load(idx + 1, 0, true); });
let last = 0;
player.addEventListener("timeupdate", () => {
  const now = Date.now();
  if (now - last > 3000) { last = now; save(); }
});
player.addEventListener("pause", () => save());
window.addEventListener("pagehide", () => save());

init();
</script>
</body>
</html>
