<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>…</title></head>
<body style="font:16px system-ui;padding:24px"><p id="m">…</p>
<script>
(function () {
  var p = new URLSearchParams(location.hash.slice(1));
  var at = p.get('access_token'), rt = p.get('refresh_token');
  if (!at || !rt) { try { sessionStorage.setItem('kitap:autherr', p.get('error_description') || 'error'); } catch (e) {} document.getElementById('m').textContent = p.get('error_description') || 'Login failed'; setTimeout(function () { location.replace('/'); }, 1200); return; }
  var exp = parseInt(p.get('expires_at') || '0', 10) || (Math.floor(Date.now() / 1000) + parseInt(p.get('expires_in') || '3600', 10));
  var u = {};
  try { var b = at.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'); u = JSON.parse(decodeURIComponent(escape(atob(b + '==='.slice((b.length + 3) % 4))))); } catch (e) {}
  localStorage.setItem('shuhyla:auth', JSON.stringify({ access_token: at, refresh_token: rt, expires_at: exp, email: u.email || '', uid: u.sub || '', name: (u.user_metadata && (u.user_metadata.full_name || u.user_metadata.name)) || '', picture: (u.user_metadata && (u.user_metadata.avatar_url || u.user_metadata.picture)) || '' }));
  location.replace('/');
})();
</script></body></html>
